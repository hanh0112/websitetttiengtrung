services:
  db:
    image: mariadb:10.11
    container_name: wordpress_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password123
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:latest
    container_name: wordpress_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password123
      WORDPRESS_DB_NAME: wordpress
      MYDUC_SMTP_HOST: ${MYDUC_SMTP_HOST:-smtp.gmail.com}
      MYDUC_SMTP_PORT: ${MYDUC_SMTP_PORT:-587}
      MYDUC_SMTP_SECURE: ${MYDUC_SMTP_SECURE:-tls}
      MYDUC_SMTP_USERNAME: ${MYDUC_SMTP_USERNAME:-}
      MYDUC_SMTP_APP_PASSWORD: ${MYDUC_SMTP_APP_PASSWORD:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content:/var/www/html/wp-content
      - type: volume
        source: wp_content_runtime
        target: /var/www/html/wp-content/plugins/elementor
        volume:
          subpath: plugins/elementor
      - type: volume
        source: wp_content_runtime
        target: /var/www/html/wp-content/plugins/woocommerce
        volume:
          subpath: plugins/woocommerce
      - ./uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./.htaccess:/var/www/html/.htaccess

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wordpress_phpmyadmin
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: rootpassword123

volumes:
  db_data:
  wp_data:
  wp_content_runtime:
    external: true
    name: website_tt_tieng_trung_wp_content_runtime
